<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="Conappt brengt berichten van bedrijven samen in één rustige inbox. Gratis, zonder telefoonnummer.">
    <title>Conappt — jouw berichten, zonder de ruis</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Ga naar de inhoud</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Zijbalk">
        <a class="brand" href="#home" aria-label="Conappt home"><img src="/icon.svg" width="34" height="34" alt=""><span>Conappt<span class="brand-dot">.</span></span></a>
        <div class="sidebar-label">JOUW OMGEVING</div>
        <nav class="desktop-navigation" aria-label="Hoofdnavigatie"></nav>
        <div class="sidebar-bottom">
          <div class="free-note"><span class="tiny-dot"></span>Gewoon gratis. Altijd.</div>
          <button class="profile-link" type="button" data-action="switch-account" aria-label="Wissel van account"><span class="avatar profile-avatar" data-profile-initial>R</span><span><strong data-profile-name>Robin</strong><small data-profile-role>Persoonlijk profiel</small></span><span class="profile-chevron" aria-hidden="true">⌃</span></button>
        </div>
      </aside>
      <div class="workspace">
        <header class="mobile-header"><a class="brand" href="#home"><img src="/icon.svg" width="29" height="29" alt=""><span>Conappt<span class="brand-dot">.</span></span></a><button class="mode-switch" type="button" data-action="switch-account" aria-label="Wissel van account"><span data-mode-icon></span><span data-mode-label>Persoonlijk</span><span aria-hidden="true">⌄</span></button></header>
        <main id="main" tabindex="-1"></main>
        <nav class="mobile-navigation" aria-label="Hoofdnavigatie"></nav>
      </div>
    </div>
    <footer class="benchmark-status" id="benchmark-status" role="status" aria-live="polite">Dev-test · testresultaat ophalen…</footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog id="app-dialog" class="app-dialog"></dialog>
    <noscript><p>Schakel JavaScript in om de Conappt-interface te gebruiken.</p></noscript>
  </body>
</html>
